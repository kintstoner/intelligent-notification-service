# Tooling only: the service itself is built from app/ by the given Dockerfile.
[tool.pytest.ini_options]
pythonpath = ["app"]
testpaths = ["app/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Deprecations raised inside the starlette/httpx versions pinned by the challenge, not by this code
filterwarnings = [
    "ignore::DeprecationWarning:starlette.testclient",
    "ignore:The 'app' shortcut is now deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["app"]
# The provider mock is part of the challenge, not of this solution
extend-exclude = ["provider"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests poll observable state on purpose instead of reaching into the code for an event
"app/tests/*" = ["ASYNC110"]
